<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="container-box">
        <div class="nav-box">
            <div class="logo">
                <img src="./Image/logo.svg" alt="" srcset="">
            </div>
            <div class="location-box">
                <div class="location">
                    <div class="icons">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <span>Lucknow</span>
                </div>
            </div>
            <div class="search-box">
                <div class="search-inner">
                    <div class="search-icons">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div class="input-box">
                        <input type="text" placeholder="Search Resturant">
                    </div>
                </div>
            </div>
            <div class="link-box">
                <ul>
                    <li><a href="#">Contact Us</a></li>
                    <li><a href="#">Blogs</a></li>
                    <li><span><a href="#">Be Prime!</a></span></li>
                </ul>
            </div>
            <div class="login-box">
                <button>Login</button>
            </div>
        </div>

    </div>

    <div class="image">
        <img src="/Image/Dine_more_spend_less_Web-Banner.avif" alt="image">
    </div>

</body>
</html>
