<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Bootstrap -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> -->
</head>

<body>
    <div class="container-box">
        <div class="nav-box">
            <div class="logo">
                <img src="./Image/logo.svg" alt="" srcset="">
            </div>
            <div class="location-box">
                <div class="location">
                    <div class="icons">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <span>Lucknow</span>
                </div>
            </div>
            <div class="search-box">
                <div class="search-inner">
                    <div class="search-icons">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div class="input-box">
                        <input type="text" placeholder="Search Resturant">
                    </div>
                </div>
            </div>
            <div class="link-box">
                <ul>
                    <li><a href="#">Contact Us</a></li>
                    <li><a href="#">Blogs</a></li>
                    <li><span><a href="#">Be Prime!</a></span></li>
                </ul>
            </div>
            <div class="login-box">
                <button>Login</button>
            </div>
        </div>

    </div>

    <div class="image">
        <img src="/Image/Dine_more_spend_less_Web-Banner.avif" alt="image">
    </div>

    <div class="container">
        <div class="upper-card-container">

            <div class="upper-card">
                <h4>Hi Foodie, Dine Anytime!</h4>
                <div class="food-card">
                    <div class="item-box ">
                        <div class="lunch-box box-border">
                            <div class="lunch-image">
                                <img src="./Image/lunch-2024.avif" alt="" srcset="">
                            </div>
                            <div class="lunch-text">Lunch</div>
                        </div>


                        <div class="dinner-box box-border">
                            <div class="lunch-image">
                                <img src="./Image/dinner-2024.avif" alt="" srcset="">
                            </div>
                            <div class="lunch-text">Dinner</div>
                        </div>
                        <div class="fast-food-box box-border">
                            <div class="lunch-image">
                                <img src="./Image/fast-food-2024.avif" alt="" srcset="">
                            </div>
                            <div class="lunch-text">Fast Food</div>
                        </div>
                        <div class="near-me-box box-border">
                            <div class="lunch-image">
                                <img src="./Image/near-me-2024.avif" alt="" srcset="">
                            </div>
                            <div class="lunch-text">Near Me</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mid-card">
            <div class="mood-card">
                <div class="mood-text">
                    <h4>What's Your Mood?</h4>
                    &nbsp;
                    |
                     &nbsp;
                    <a href="#">See All</a>
                </div>

                <!-- mid card box -->


                <!-- North-indian -->
                <div class="mid-card-outer">
                    <div class="mid-card-box">
                        <div class="food-image">
                            <img src="./Image/north-indian-3x.avif" alt="" srcset="">
                        </div>
                        <div class="food-text">
                            <div class="heading-box">
                                <h4>North Indian</h4>
                            </div>
                            <div class="para-text">
                                <span>1107 Resturant</span>
                            </div>
                        </div>
                    </div>

                    <!-- Chinese -->
                    <div class="mid-card-box">
                        <div class="food-image">
                            <img src="./Image/chinese-3x.avif" alt="" srcset="">
                        </div>
                        <div class="food-text">
                            <div class="heading-box">
                                <h4>Chinese</h4>
                            </div>
                            <div class="para-text">
                                <span>455 Resturant</span>
                            </div>
                        </div>
                    </div>

                    <!-- South Indian -->
                    <div class="mid-card-box">
                        <div class="food-image">
                            <img src="./Image/south-indiann-3x.avif" alt="" srcset="">
                        </div>
                        <div class="food-text">
                            <div class="heading-box">
                                <h4>South Indian</h4>
                            </div>
                            <div class="para-text">
                                <span>112 Resturant</span>
                            </div>
                        </div>
                    </div>
                    <div class="mid-card-box">
                        <div class="food-image">
                            <img src="./Image/european-3x.avif" alt="" srcset="">
                        </div>
                        <div class="food-text">
                            <div class="heading-box">
                                <h4>European</h4>
                            </div>
                            <div class="para-text">
                                <span>33 Resturant</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- chinese -->


            </div>
        </div>
    </div>
    </div>
</body>

</html>
